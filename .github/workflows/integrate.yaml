name: CI

on:
  workflow_call:

jobs:
  terraform-lint:
    name: Terraform fmt & tflint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo snap install terraform --classic
      - run: sudo snap install tflint
      - run: terraform fmt -check -recursive terraform/
      - run: cd terraform && tflint --recursive

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Each root module is validated separately: after removing the flat
        # module, terraform/ has no root .tf files of its own.
        module:
          - terraform/products/kserve
          - terraform/products/llm
          - terraform/deployments/llm-cos
    steps:
      - uses: actions/checkout@v5
      - run: sudo snap install terraform --classic
      - run: terraform -chdir=${{ matrix.module }} init -backend=false
      - run: terraform -chdir=${{ matrix.module }} validate

  lint:
    name: Linting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: pipx install tox
      - run: tox -e lint

  integration-test:
    name: Integration tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario:
        - kserve-serverless  # istio-sidecar + knative + kserve
        - kserve-standard    # istio-ambient + kserve-controller (RawDeployment)
        - llm-cos            # envoy + kserve-llm + COS

    steps:
      - name: Maximise GH runner space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install tox
        run: pipx install tox

      - name: Set up environment
        run: |
          sudo apt-get remove -y docker-ce docker-ce-cli containerd.io
          sudo rm -rf /run/containerd
          sudo snap install concierge --classic
          sudo concierge prepare --trace

      # Ambient Istio (kserve-standard) needs Cilium tuned to coexist with the
      # Istio CNI. See https://docs.cilium.io/en/stable/network/servicemesh/istio/
      - name: Configure Cilium for Istio ambient
        if: matrix.scenario == 'kserve-standard'
        run: |
          kubectl -n kube-system patch configmap cilium-config --type merge --patch '{"data":{"bpf-lb-sock-hostns-only":"true"}}'
          kubectl -n kube-system patch configmap cilium-config --type merge --patch '{"data":{"cni-exclusive":"false"}}'
          kubectl -n kube-system rollout restart daemonset cilium

      - name: Run integration test for the ${{ matrix.scenario }} scenario
        run: |
          tox -e integration -- --scenario ${{ matrix.scenario }}

      - name: Dump juju status on failure
        if: failure()
        run: |
          for m in kserve kserve-llm cos; do
            echo "=== model: $m ==="
            juju status --model "$m" --relations 2>/dev/null || true
          done
