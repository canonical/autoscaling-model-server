# poetry
[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.8.1"

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Linting tools configuration
[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.extend-ignore = [
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
lint.ignore = ["D107"]
extend-exclude = ["__pycache__", "*.egg_info"]
lint.per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104"]}

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage,.lock"
ignore-words-list = "NotIn"

# LSPs and formatters
[tool.pyright]
include = ["src"]

[tool.black]
line-length = 99
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 99

# format
[tool.poetry.group.fmt]
optional = true

[tool.poetry.group.fmt.dependencies]
ruff = "^0.8.0"
black = "^23.12.1"
isort = "^5.13.1"

# lint
[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "^0.8.0"
codespell = "^2.3.0"
pyright = "^1.1.386"
black = "^23.12.1"
pytest = "^8.3.3"
jubilant = "^1.8.0"

# integration tests
[tool.poetry.group.integration]
optional = true

[tool.poetry.group.integration.dependencies]
jubilant = "^1.8.0"
pytest = "^8.3.3"
pytest-dependency = "^0.6.1"
tenacity = "^9.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
